[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-task-scheduler"
version = "0.1.0"
description = "Distributed task scheduler with AI agent orchestration"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.7,<3",
    "aiokafka>=0.12,<1",
    "redis>=5.2,<7",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "prometheus-client>=0.21,<1",
    "httpx>=0.28,<1",
    "croniter>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "pytest-cov>=7,<8", "coverage>=7.10,<8", "mypy>=1.15,<2", "types-croniter>=6,<7"]

[tool.setuptools.packages.find]
include = ["shared*", "scripts*", "services*"]

[tool.setuptools.package-data]
shared = ["kafka-topics.txt", "contracts/*.json", "observability.sql"]
"services.agent" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires running Docker infrastructure", "java: requires opt-in Java profile and Maven container", "chaos: destructive faults scoped to an isolated labelled test project"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["shared", "services"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["services/worker-java/"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["shared", "services"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 81

[tool.coverage.html]
directory = "artifacts/coverage/html"

[tool.coverage.xml]
output = "artifacts/coverage/coverage.xml"

[tool.coverage.json]
output = "artifacts/coverage/coverage.json"
