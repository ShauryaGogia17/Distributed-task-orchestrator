server:
  address: ${JAVA_WORKER_HOST:0.0.0.0}
  port: ${JAVA_WORKER_PORT:8007}
  shutdown: graceful
spring:
  application:
    name: task-scheduler-java-worker
  lifecycle:
    timeout-per-shutdown-phase: 90s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:task_scheduler}
    username: ${POSTGRES_USER:task_scheduler}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 5s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${JAVA_WORKER_GROUP_ID:task-workers-java}
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: ${JAVA_WORKER_MAX_POLL_INTERVAL_MS:300000}
        max.partition.fetch.bytes: ${KAFKA_MAX_MESSAGE_BYTES:33554432}
        fetch.max.bytes: ${KAFKA_MAX_MESSAGE_BYTES:33554432}
        partition.assignment.strategy: org.apache.kafka.clients.consumer.RoundRobinAssignor
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.request.size: ${KAFKA_MAX_MESSAGE_BYTES:33554432}
        request.timeout.ms: 10000
        delivery.timeout.ms: 15000
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: true
      observation-enabled: true
worker:
  id: ${JAVA_WORKER_ID:}
  group-id: ${JAVA_WORKER_GROUP_ID:task-workers-java}
  concurrency: ${JAVA_WORKER_CONCURRENCY:2}
  task-timeout-seconds: ${JAVA_WORKER_TASK_TIMEOUT_SECONDS:30}
  visibility-timeout-seconds: ${JAVA_WORKER_VISIBILITY_TIMEOUT_SECONDS:60}
  retry-base-seconds: ${WORKER_RETRY_BASE_SECONDS:5}
  retry-cap-seconds: ${WORKER_RETRY_CAP_SECONDS:300}
  max-crash-claims: ${WORKER_MAX_CRASH_CLAIMS:3}
  heartbeat-ttl-seconds: ${WORKER_HEARTBEAT_TTL_SECONDS:20}
  circuit-key-prefix: ${CIRCUIT_KEY_PREFIX:task-scheduler:circuit:}
  circuit-cooldown-seconds: ${CIRCUIT_COOLDOWN_SECONDS:30}
  max-task-message-bytes: ${API_MAX_TASK_MESSAGE_BYTES:900000}
  publish-timeout-seconds: ${JAVA_WORKER_PUBLISH_TIMEOUT_SECONDS:20}
  outbox-batch-size: ${API_OUTBOX_BATCH_SIZE:100}
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health:
    show-details: never
    probes.enabled: true
  metrics.tags.application: worker-java
logging:
  level:
    org.apache.kafka: WARN
    org.hibernate: WARN
    io.lettuce: WARN

  structured.format.console: logstash
