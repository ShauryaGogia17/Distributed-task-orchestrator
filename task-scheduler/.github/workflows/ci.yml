name: Scheduler CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Generate an unused unit-test settings credential
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write('POSTGRES_PASSWORD=' + secrets.token_urlsafe(32) + '\n')
          PY
      - run: python -m ruff check shared services scripts tests migrations
      - run: python -m ruff format --check shared services scripts tests migrations
      - run: python -m mypy
      - run: python scripts/export_contracts.py --check
      - name: Unit tests and coverage reports
        run: |
          python -m pytest tests/unit -q --cov --cov-report=term-missing --cov-report=json --cov-report=xml --cov-report=html --junitxml=artifacts/junit/unit.xml
          python scripts/check_coverage.py
      - name: Alert rule regression scenarios
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/observability/prometheus:/work:ro" -w /work prom/prometheus:v3.16.0 test rules rules.test.yml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-coverage
          path: |
            artifacts/coverage/
            artifacts/junit/
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/test_stack.py integration
      - name: Remove the owned test project after cancellation
        if: always()
        run: |
          if [ -f artifacts/test-stack.env ]; then
            docker compose --env-file artifacts/test-stack.env -f docker-compose.test.yml --profile test --profile chaos down --volumes --remove-orphans
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-evidence
          path: |
            artifacts/junit/
            artifacts/test-stack.log
  chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/test_stack.py chaos
      - name: Remove the owned test project after cancellation
        if: always()
        run: |
          if [ -f artifacts/test-stack.env ]; then
            docker compose --env-file artifacts/test-stack.env -f docker-compose.test.yml --profile test --profile chaos down --volumes --remove-orphans
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chaos-evidence
          path: |
            artifacts/chaos/
            artifacts/junit/
            artifacts/test-stack.log
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, scheduler, dlq, agent, worker-java]
    steps:
      - uses: actions/checkout@v6
      - name: Build runnable production image
        run: docker build --file services/${{ matrix.service }}/Dockerfile --tag scheduler-${{ matrix.service }}:ci .
  java-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/test_java_contract.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: java-contract-results
          path: services/worker-java/target/surefire-reports/
