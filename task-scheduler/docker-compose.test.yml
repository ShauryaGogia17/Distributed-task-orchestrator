name: ${TEST_PROJECT_NAME:?Use scripts/test_stack.py}

x-labels: &labels
  io.task-scheduler.test-stack: "true"
x-environment: &environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: task_scheduler_test
  POSTGRES_USER: task_scheduler_test
  POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Use scripts/test_stack.py}
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  KAFKA_CLIENT_ID: test-suite
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  API_HOST: 0.0.0.0
  API_PORT: "8000"
  API_OUTBOX_POLL_SECONDS: "0.1"
  API_OUTBOX_RETRY_SECONDS: "0.2"
  API_OUTBOX_PUBLISH_TIMEOUT_SECONDS: "2"
  API_HEALTH_TIMEOUT_SECONDS: "2"
  WORKER_GROUP_ID: test-workers
  WORKER_CONCURRENCY: "2"
  WORKER_TASK_TIMEOUT_SECONDS: "15"
  WORKER_VISIBILITY_TIMEOUT_SECONDS: "5"
  WORKER_HEARTBEAT_INTERVAL_SECONDS: "1"
  WORKER_HEARTBEAT_TTL_SECONDS: "4"
  WORKER_RETRY_BASE_SECONDS: "0.2"
  WORKER_RETRY_CAP_SECONDS: "1"
  WORKER_RETRY_ENGINE_POLL_SECONDS: "0.2"
  WORKER_RETRY_POLL_SECONDS: "0.2"
  WORKER_RESULT_PUBLISH_TIMEOUT_SECONDS: "10"
  WORKER_SHUTDOWN_TIMEOUT_SECONDS: "20"
  WORKER_REBALANCE_TIMEOUT_SECONDS: "20"
  WORKER_METRICS_ENABLED: "false"
  SCHEDULER_HOST: 0.0.0.0
  SCHEDULER_PORT: "8001"
  SCHEDULER_LEADER_TTL_SECONDS: "3"
  SCHEDULER_RENEWAL_SECONDS: "0.5"
  SCHEDULER_POLL_SECONDS: "0.2"
  SCHEDULER_ELECTION_POLL_SECONDS: "0.2"
  SCHEDULER_MISFIRE_GRACE_SECONDS: "30"
  DLQ_HOST: 0.0.0.0
  DLQ_PORT: "8005"
  DLQ_GROUP_ID: test-dlq
  AGENT_ENABLED: "false"
  LLM_PROVIDER: mock

x-app: &app
  image: ${TEST_IMAGE:-task-scheduler-test-runner:local}
  labels: *labels
  environment: *environment
  networks: [test]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.8-alpine
    labels: *labels
    environment:
      POSTGRES_DB: task_scheduler_test
      POSTGRES_USER: task_scheduler_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
    volumes: [postgres-test:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [test]
  redis:
    image: redis:7.4.2-alpine
    labels: *labels
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes: [redis-test:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [test]
  kafka:
    image: apache/kafka:4.1.2
    labels: *labels
    environment:
      CLUSTER_ID: ${TEST_KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
      KAFKA_MESSAGE_MAX_BYTES: "33554432"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "33554432"
    volumes: [kafka-test:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:19092, --list]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 30
    networks: [test]
  kafka-init:
    image: apache/kafka:4.1.2
    labels: *labels
    profiles: [test]
    entrypoint: [bash, /opt/bootstrap/init-kafka.sh]
    volumes:
      - ./scripts/init-kafka.sh:/opt/bootstrap/init-kafka.sh:ro
      - ./shared/kafka-topics.txt:/opt/bootstrap/kafka-topics.txt:ro
    depends_on:
      kafka: {condition: service_healthy}
    networks: [test]
  migrate:
    <<: *app
    profiles: [test]
    restart: "no"
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    profiles: [chaos]
    command: [python, -m, services.api]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 3s
      timeout: 8s
      retries: 30
  worker-a:
    <<: *app
    profiles: [chaos]
    command: [python, -m, services.worker]
    environment:
      <<: *environment
      WORKER_ID: worker-a
    healthcheck: &worker-health
      test: [CMD, python, -m, services.worker.health]
      interval: 3s
      timeout: 5s
      retries: 30
  worker-b:
    <<: *app
    profiles: [chaos]
    command: [python, -m, services.worker]
    environment:
      <<: *environment
      WORKER_ID: worker-b
    healthcheck: *worker-health
  scheduler-a:
    <<: *app
    profiles: [chaos]
    command: [python, -m, services.scheduler]
    environment:
      <<: *environment
      SCHEDULER_ID: scheduler-a
    healthcheck: &scheduler-health
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=5).close()"]
      interval: 3s
      timeout: 8s
      retries: 30
  scheduler-b:
    <<: *app
    profiles: [chaos]
    command: [python, -m, services.scheduler]
    environment:
      <<: *environment
      SCHEDULER_ID: scheduler-b
    healthcheck: *scheduler-health
  dlq:
    <<: *app
    profiles: [chaos]
    command: [python, -m, services.dlq]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8005/health', timeout=5).close()"]
      interval: 3s
      timeout: 8s
      retries: 30
  runner:
    <<: *app
    profiles: [test]
    restart: "no"
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      <<: *environment
      CHAOS_PROJECT: ${TEST_PROJECT_NAME}
      CHAOS_API_URL: http://api:8000
    volumes:
      - ./artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  kafka-test:
  redis-test:
  postgres-test:
networks:
  test:
    driver: bridge
